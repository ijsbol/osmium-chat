[project]
name = "osmium-chat"
version = "0.3.6"
description = "A Python API wrapper for Osmium."
readme = "README.md"
license = "MIT"
authors = [{ name = "abigail phoebe", email = "abigail@phoebe.sh" }]
requires-python = ">=3.13,<4.0"
dependencies = [
    "osmium-protos==2.0.2",
    "websockets>=16.0",
]

[project.urls]
Homepage = "https://github.com/ijsbol/osmium-chat"
"Bug Tracker" = "https://github.com/ijsbol/osmium-chat/issues"

[dependency-groups]
dev = [
    "isort>=8.0.1",
    "ruff>=0.15.15",
    "twine>=6.2.0,<7.0.0",
    "build>=1.4.0,<2.0.0",
    "flake8>=7.3.0,<8.0.0",
    "pytest>=9.0.3,<10.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["osmium_chat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["COM812"]

[tool.ruff.format]
skip-magic-trailing-comma = false
